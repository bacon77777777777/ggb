<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GGB 拉霸機 v6</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { height:100%; }
  body {
    background:#141414;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    font-family:"PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
    padding:16px; gap:12px; overflow-x:hidden;
  }
  .stage {
    position:relative;
    width:min(92vw, calc((100vh - 130px) * 0.8047), 520px);
    aspect-ratio: 750 / 932;
    container-type:inline-size;
    animation: breathe 3.4s ease-in-out infinite;
    user-select:none; -webkit-user-select:none;
  }
  @keyframes breathe {
    0%,100% { filter: drop-shadow(0 0 16px rgba(255,150,40,.16)); }
    50%     { filter: drop-shadow(0 0 32px rgba(255,180,60,.38)); }
  }
  .stage.rushmode { animation: breatheFast .4s ease-in-out infinite; }
  @keyframes breatheFast {
    0%,100% { filter: drop-shadow(0 0 24px rgba(255,70,40,.5)); }
    50%     { filter: drop-shadow(0 0 54px rgba(255,220,70,.9)); }
  }
  .layer { position:absolute; pointer-events:none; }
  .machine { inset:0; background:var(--main) center/100% 100% no-repeat; }

  /* ══ 機台部位發光 ══ */
  .lit {
    position:absolute; inset:0; pointer-events:none; z-index:4;
    background:var(--main) center/100% 100% no-repeat;
    mix-blend-mode:screen;
    filter: brightness(2.1) saturate(1.75) blur(2.5px);
    opacity:0;
    animation-delay: var(--d, 0s);
  }
  @keyframes litPulse  { 0%,100%{opacity:0;} 50%{opacity:.85;} }
  @keyframes litStrobe { 0%{opacity:1;} 50%{opacity:.05;} }
  .lit-star   { animation: litPulse 3.5s ease-in-out infinite; }
  .lit-ribbon { animation: litPulse 5s   ease-in-out infinite; }
  .lit-mframe { animation: litPulse 4s   ease-in-out infinite; }
  .lit-bar    { animation: litPulse 1.9s ease-in-out infinite; }
  .lit-deck   { animation: litPulse 4.6s ease-in-out infinite; }
  .lit-reelfr { animation: none; }
  .spinning .lit-bar    { animation-duration:.55s; }
  .spinning .lit-mframe { animation-duration:1.2s; }
  .spinning .lit-deck   { animation-duration:1.6s; }
  .rushmode .lit { animation: litStrobe .14s steps(2) infinite !important; }


  /* ══ 大当り看板 LED 跑馬燈（v4 風格） ══ */
  .marquee {
    position:absolute; left:24.93%; top:14.59%; width:50%; height:7.83%;
    overflow:hidden; border-radius:1cqw;
    display:flex; align-items:center; z-index:5;
  }
  .marquee .txt {
    white-space:nowrap; font-weight:900; letter-spacing:.35cqw;
    font-size:3.6cqw; color:#ffb51e;
    text-shadow:0 0 .8cqw #ff8c00, 0 0 2.4cqw rgba(255,120,0,.9);
    animation: ticker 9s linear infinite;
  }
  @keyframes ticker { from{transform:translateX(100%);} to{transform:translateX(-100%);} }
  .marquee.win .txt {
    animation: strobeTxt .22s steps(2) infinite; font-size:4.4cqw; margin:auto; transform:none;
    color:#fff35e; text-shadow:0 0 1cqw #ff2a00, 0 0 3cqw #ffb300;
  }
  @keyframes strobeTxt { 0%{opacity:1;} 50%{opacity:.15;} }
  .marquee::after {
    content:""; position:absolute; inset:0; pointer-events:none;
    background:radial-gradient(rgba(0,0,0,.55) 28%, transparent 32%);
    background-size:.9cqw .9cqw;
  }

  /* ══ RUSH 亮牌 ══ */
  .rushsign {
    left:27.07%; top:27.15%; width:45.87%; height:8.8%; z-index:5;
    background:var(--lr) center/100% 100% no-repeat;
    animation: signPulse 2.4s ease-in-out infinite;
    transform-origin:center;
  }
  @keyframes signPulse {
    0%,100% { opacity:.72; filter:drop-shadow(0 0 .3cqw rgba(255,190,60,.4)); }
    50%     { opacity:1;   filter:drop-shadow(0 0 1.6cqw rgba(255,200,70,.95)); }
  }
  .spinning .rushsign { animation-duration:.85s; }
  .rushmode .rushsign { animation: signStrobe .15s steps(2) infinite; }
  @keyframes signStrobe {
    0% { opacity:1; transform:scale(1.06); filter:drop-shadow(0 0 2.2cqw #ffd84d) brightness(1.5); }
    50%{ opacity:.25; transform:scale(1); }
  }

  /* ══ 拉桿（美術 4 格動畫） ══ */
  .lever-hit { position:absolute; left:2%; top:44%; width:16%; height:26%; z-index:7; cursor:pointer; }
  .lever-hit:hover ~ .lever .lf.show { filter:brightness(1.18) drop-shadow(0 0 1cqw rgba(255,230,150,.8)); }
  .lever { position:absolute; left:5.07%; top:50.32%; height:30.47%; z-index:6; pointer-events:none; }
  .lf { position:absolute; left:0; top:0; height:100%; background:center/100% 100% no-repeat; opacity:0; }
  .lf.show { opacity:1; }
  .lf1 { aspect-ratio:69/284;  background-image:var(--l1); }
  .lf2 { aspect-ratio:73/284;  background-image:var(--l2); }
  .lf3 { aspect-ratio:74/284;  background-image:var(--l3); }
  .lf4 { aspect-ratio:70/284;  background-image:var(--l4); }

  /* ══ 滾輪（v4 風格） ══ */
  .reel { position:absolute; overflow:hidden; z-index:3; }
  #r0 { left:22.00%; top:40.77%; width:17.07%; height:15.88%; }
  #r1 { left:42.40%; top:40.77%; width:16.13%; height:15.88%; }
  #r2 { left:61.73%; top:40.77%; width:16.27%; height:15.88%; }
  .strip { position:absolute; left:0; width:100%; will-change:transform; }
  .cell {
    height:var(--rowH,100px); display:flex; align-items:center; justify-content:center;
    font-weight:900; font-size:9.5cqw; font-family:Impact,"Arial Black","Microsoft JhengHei",sans-serif;
  }
  .s7   { color:#e03014; text-shadow:.3cqw .3cqw 0 #7a0d00; }
  .sHu  { color:#ff9500; text-shadow:.3cqw .3cqw 0 #6b3c00; }
  .sSho { color:#d4a017; text-shadow:.3cqw .3cqw 0 #5e4506; }
  .sBar { color:#1c1c1c; font-size:7cqw; letter-spacing:.2cqw; text-shadow:.2cqw .2cqw 0 #999; }
  .sBolt{ color:#f5c400; text-shadow:0 0 1.2cqw #ff9d00; }
  .sStar{ color:#b03df0; text-shadow:.3cqw .3cqw 0 #4d0f73; }
  .reel.blur .strip { filter:blur(.45cqw); }
  .reel .shade { position:absolute; inset:0; pointer-events:none;
    background:linear-gradient(rgba(70,70,70,.3), transparent 26%, transparent 74%, rgba(70,70,70,.3)); }
  .reel.hit { animation: reelFlash .3s steps(2) 6; }
  @keyframes reelFlash { 0%{box-shadow:inset 0 0 0 .6cqw #ffe14d, 0 0 2.6cqw #ffd000;} 50%{box-shadow:none;} }

  /* ══ 按鈕 ══ */
  .btn { position:absolute; z-index:7; cursor:pointer; background:center/100% 100% no-repeat; }
  #btnAuto { left:21.87%; top:61.48%; width:17.33%; height:8.58%;  background-image:var(--auto); }
  #btnSpin { left:39.20%; top:62.34%; width:23.73%; height:11.16%; background-image:var(--spin);
             animation: invite 1.8s ease-in-out infinite; }
  #btnRush { left:62.93%; top:61.48%; width:17.33%; height:8.58%;  background-image:var(--auto); }
  @keyframes invite { 0%,100%{ filter:drop-shadow(0 0 .2cqw rgba(255,220,120,.3)); }
                      50%    { filter:drop-shadow(0 0 1.6cqw rgba(255,220,120,.95)) brightness(1.12); } }
  .btn:hover  { filter:brightness(1.15) drop-shadow(0 0 1cqw rgba(255,230,150,.8)); }
  .btn:active { transform:translateY(3%) scale(.97); filter:brightness(.92); }
  .spinning .btn, .spinning .lever-hit { pointer-events:none; }
  .spinning .btn { filter:saturate(.6) brightness(.85); animation:none; }
  #btnAuto.on { animation:autopulse .9s infinite; }
  @keyframes autopulse { 50%{ filter:brightness(1.5) drop-shadow(0 0 1.4cqw #ffd84d);} }

  /* ══ 大当り ══ */
  .bigwin { position:absolute; inset:0; display:none; align-items:center; justify-content:center; pointer-events:none; z-index:9; }
  .bigwin.show { display:flex; }
  .bigwin span {
    font-family:Impact,"Arial Black","Microsoft JhengHei",sans-serif;
    font-size:15cqw; font-weight:900; letter-spacing:1cqw; white-space:nowrap;
    background:linear-gradient(#fff8c2, #ffd400 40%, #ff7a00 70%, #ffd400);
    -webkit-background-clip:text; background-clip:text; color:transparent;
    filter:drop-shadow(0 0 1.5cqw #ff3c00) drop-shadow(.5cqw .8cqw 0 rgba(80,20,0,.9));
    animation: winpop .5s cubic-bezier(.2,2.4,.4,1) both, winstrobe .16s steps(2) .5s infinite;
  }
  @keyframes winpop { from{transform:scale(.1) rotate(-8deg); opacity:0;} to{transform:scale(1) rotate(-4deg); opacity:1;} }
  @keyframes winstrobe { 50%{ filter:drop-shadow(0 0 4cqw #fff35e) drop-shadow(.5cqw .8cqw 0 rgba(80,20,0,.9)) brightness(1.6);} }

  #flash {
    position:absolute; inset:0; pointer-events:none; z-index:10; opacity:0;
    background:radial-gradient(circle at 50% 42%, rgba(255,250,220,.98), rgba(255,190,60,.6) 45%, transparent 75%);
    border-radius:3cqw;
  }
  #flash.go { animation: flashout .6s ease-out both; }
  @keyframes flashout { 0%{opacity:1;} 100%{opacity:0;} }

  .stage.shake { animation: shake .09s linear 10; }
  @keyframes shake { 25%{transform:translate(.6cqw,-.4cqw) rotate(.3deg);} 75%{transform:translate(-.6cqw,.4cqw) rotate(-.3deg);} }

  .coin {
    position:absolute; width:4.6cqw; height:4.6cqw; border-radius:50%;
    pointer-events:none; z-index:8;
    background:radial-gradient(circle at 35% 28%, #fff6bd, #ffd93a 42%, #eda800 72%, #b97a00);
    border:.4cqw solid #925f00;
    display:flex; align-items:center; justify-content:center;
    color:#8a5a00; font-weight:900; font-size:2.4cqw;
    font-family:Impact,"Arial Black",sans-serif;
    box-shadow:0 0 1.2cqw rgba(255,190,40,.95), inset 0 -.4cqw .6cqw rgba(140,80,0,.5);
  }

  .toolbar { display:flex; gap:10px; }
  .pill {
    background:#2a2a2a; color:#e9b34a; border:1px solid #4a3a1a; border-radius:99px;
    padding:6px 16px; font-size:13px; cursor:pointer;
  }
  .pill:hover { background:#383020; }
  .hint { color:#8d8d8d; font-size:13px; text-align:center; max-width:540px; line-height:1.7; }
  .hint b { color:#e9b34a; }

  @media (prefers-reduced-motion: reduce) {
    .stage, .lit, .rushsign, #btnSpin { animation:none !important; }
  }
</style>
</head>

  const reels  = [0,1,2].map(i => document.getElementById('r'+i));
  const strips = reels.map(r => r.querySelector('.strip'));
  let rowH=0, offsets=[0,0,0], spinning=false, soundOn=true, autoLeft=0;

  strips.forEach(s => {
    let html='';
    for (let k=0;k<REP;k++) for (const sym of SYMS) html += `<div class="cell ${sym.c}">${sym.t}</div>`;
    s.innerHTML = html;
  });
  function layout() {
    rowH = reels[0].clientHeight;
    document.querySelectorAll('.cell').forEach(c => c.style.height = rowH+'px');
    strips.forEach((s,i)=> s.style.transform = `translateY(${-offsets[i]}px)`);
  }
  window.addEventListener('resize', layout);
  layout(); setTimeout(layout, 300);

  /* ══ 音效 ══ */
  let AC=null;
  const ac = () => (AC ||= new (window.AudioContext||window.webkitAudioContext)());
  function beep(f,dur=.09,type='square',vol=.12,when=0) {
    if (!soundOn) return;
    const t=ac().currentTime+when;
    const o=ac().createOscillator(), g=ac().createGain();
    o.type=type; o.frequency.value=f;
    g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(.001,t+dur);
    o.connect(g).connect(ac().destination); o.start(t); o.stop(t+dur);
  }
  const clack = () => beep(180,.06,'triangle',.25);
  const clunk = () => { beep(90,.12,'triangle',.3); beep(60,.16,'sine',.25,.03); };
  function winJingle() {
    [660,880,990,1320,990,1320,1760].forEach((f,i)=>{ beep(f,.14,'square',.14,i*.12); beep(f/2,.14,'triangle',.1,i*.12); });
  }

  /* ══ 拉桿動畫 1→4→1 ══ */
  const lf = [...document.querySelectorAll('.lf')];
  function showFrame(i){ lf.forEach((f,k)=>f.classList.toggle('show', k===i)); }
  function pullLever() {
    clunk();
    [0,1,2,3].forEach((i,k)=> setTimeout(()=>showFrame(i), k*70));
    [2,1,0].forEach((i,k)=> setTimeout(()=>showFrame(i), 380+k*90));
  }

  const ease = t => 1 - Math.pow(1-t,4);

  function spin(forceWin=false) {
    if (spinning) return;
    spinning = true;
    ac().resume && ac().resume();
    pullLever();
    stage.classList.add('spinning');
    stage.classList.remove('rushmode');
    document.getElementById('bigwin').classList.remove('show');
    marquee.classList.remove('win');
    mtxt.textContent = '★ GOOD LUCK !! ★ RUSH CHANCE ★ GOOD LUCK !! ★';

    const jackpot = forceWin || Math.random() < .4;
    const hit = Math.floor(Math.random()*N);
    let targets;
    if (jackpot) targets=[hit,hit,hit];
    else { do { targets=[0,1,2].map(()=>Math.floor(Math.random()*N)); } while (targets[0]===targets[1] && targets[1]===targets[2]); }

    const cycle = N*rowH;
    const anims = targets.map((tg,i)=>{
      const start = offsets[i];
      const loops = 3+i;
      const endAligned = ((tg*rowH)%cycle+cycle)%cycle;
      const dist = loops*cycle + ((endAligned-(start%cycle))+cycle)%cycle;
      return {start,dist,dur:1400+i*650,done:false,i};
    });
    reels.forEach(r=>r.classList.add('blur'));
    let lastTick=0; const t0=performance.now();
    function frame(now){
      const el=now-t0;
      if (el-lastTick>90){ lastTick=el; beep(90+Math.random()*40,.03,'sawtooth',.05); }
      let allDone=true;
      for (const a of anims){
        const p=Math.min(el/a.dur,1);
        offsets[a.i]=(a.start+a.dist*ease(p))%cycle;
        strips[a.i].style.transform=`translateY(${-offsets[a.i]}px)`;
        if (p>.65) reels[a.i].classList.remove('blur');
        if (p>=1 && !a.done){ a.done=true; clack(); }
        if (p<1) allDone=false;
      }
      if (!allDone) requestAnimationFrame(frame);
      else finish(jackpot);
    }
    requestAnimationFrame(frame);
  }

  function finish(jackpot) {
    stage.classList.remove('spinning');
    spinning=false;
    if (jackpot) {
      stage.classList.add('rushmode','shake');
      const fl=document.getElementById('flash');
      fl.classList.remove('go'); void fl.offsetWidth; fl.classList.add('go');
      reels.forEach(r=>r.classList.add('hit'));
      marquee.classList.add('win');
      mtxt.textContent = '大当り RUSH !!';
      document.getElementById('bigwin').classList.add('show');
      winJingle(); setTimeout(winJingle,900);
      coinBurst(); setTimeout(coinBurst,800); setTimeout(coinBurst,1600);
      setTimeout(()=>{ stage.classList.remove('shake'); reels.forEach(r=>r.classList.remove('hit')); },1200);
      setTimeout(()=>{
        stage.classList.remove('rushmode');
        document.getElementById('bigwin').classList.remove('show');
        marquee.classList.remove('win');
        mtxt.textContent = '★ TIGER RUSH ★ 押忍!! ★ 再來一次 ★';
        next();
      },3400);
    } else { mtxt.textContent = '★ 押忍! 再挑戰一次 ★ TIGER RUSH ★'; next(); }
  }
  function next(){ if (autoLeft>0){ autoLeft--; if(autoLeft===0) document.getElementById('btnAuto').classList.remove('on'); setTimeout(()=>spin(),700);} }

  function coinBurst() {
    for (let i=0;i<32;i++){
      const c=document.createElement('div');
      c.className='coin'; c.textContent='G';
      c.style.left='50%'; c.style.top='50%';
      stage.appendChild(c);
      const ang=Math.random()*Math.PI*2, sp=18+Math.random()*36;
      let vx=Math.cos(ang)*sp, vy=Math.sin(ang)*sp-32, x=0,y=0,life=0;
      const flip=6+Math.random()*10;
      (function fly(){
        life++; vy+=3.2*.14; x+=vx*.14; y+=vy*.14;
        c.style.transform=`translate(${x}cqw,${y}cqw) rotateY(${life*flip}deg) rotate(${life*4}deg)`;
        c.style.opacity=1-life/75;
        if (life<75) requestAnimationFrame(fly); else c.remove();
      })();
    }
  }

  document.getElementById('btnSpin').addEventListener('click', ()=>spin());
  document.getElementById('leverHit').addEventListener('click', ()=>spin());
  document.getElementById('btnRush').addEventListener('click', ()=>spin(true));
  document.getElementById('btnAuto').addEventListener('click', function(){
    if (spinning) return; autoLeft=5; this.classList.add('on'); spin();
  });
  document.getElementById('btnSound').addEventListener('click', function(){
    soundOn=!soundOn; this.textContent = soundOn ? '🔊 音效：開' : '🔇 音效：關';
    if (soundOn) beep(880,.1,'square',.15);
  });
})();
</script>
</body>
