  .fiber{position:absolute;inset:0;background:var(--paper);will-change:transform}
  #stub-fiber{transform:translateX(3px)}
  #body-fiber{transform:translateX(-3px)}
  #stub,#stub-fiber{filter:drop-shadow(-4px 8px 10px rgba(0,0,0,.4))}
  #body-wrap{position:absolute;inset:0;will-change:transform}
  #body,#body-fiber{filter:drop-shadow(6px 10px 14px rgba(0,0,0,.45))}
  #body-wrap.spring{transition:transform .45s cubic-bezier(.3,1.6,.4,1)}
  #body-wrap.fly{transition:transform .75s cubic-bezier(.25,.6,.3,1),opacity .75s ease-in}
  #stub-wrap{position:absolute;inset:0;will-change:transform;transition:transform .45s cubic-bezier(.3,1.6,.4,1)}

  /* perforation */
  #perf{position:absolute;left:20%;top:7%;height:86%;width:0;border-left:2.5px dashed rgba(255,255,255,.85);
    filter:drop-shadow(0 0 3px rgba(0,0,0,.4));transition:opacity .2s;pointer-events:none}

  /* 往右撕開 pill */
  #tear-label{position:absolute;left:4.5%;top:50%;transform:translateY(-50%);
    writing-mode:vertical-rl;letter-spacing:.34em;padding:.7em .28em .45em;
    color:#fff;font-size:12px;font-weight:600;background:rgba(20,20,20,.55);
    border-radius:99px;pointer-events:none;transition:opacity .2s}

  /* hint finger */
  #hint{position:absolute;left:46%;top:54%;font-size:44px;z-index:7;pointer-events:none;
    filter:drop-shadow(0 4px 6px rgba(0,0,0,.5));animation:nudge 1.5s ease-in-out infinite}
  @keyframes nudge{0%,100%{transform:translate(0,0) rotate(-8deg)}55%{transform:translate(56px,-6px) rotate(4deg)}}

  /* particles */
  .bit{position:absolute;z-index:8;pointer-events:none;border-radius:1px}

  /* ---------- chrome ---------- */
  .ui-btn{position:absolute;z-index:20;border:0;cursor:pointer;color:#fff;font-family:inherit}
  #snd{top:18px;right:18px;width:46px;height:46px;border-radius:50%;background:rgba(15,15,18,.62);
    font-size:19px;display:flex;align-items:center;justify-content:center;backdrop-filter:blur(4px)}
  #skip{bottom:26px;right:22px;padding:15px 34px;border-radius:12px;background:rgba(15,15,18,.62);
    font-size:17px;letter-spacing:.35em;text-indent:.35em;backdrop-filter:blur(4px)}
  #brand{position:absolute;bottom:26px;left:22px;width:52px;height:52px;border-radius:50%;
    background:rgba(15,15,18,.72);color:#fff;display:flex;align-items:center;justify-content:center;
    font-size:24px;font-weight:800;z-index:20;font-family:Georgia,serif}
  .ui-btn:active{transform:scale(.94)}

  /* ---------- reveal ---------- */
  #reveal{position:absolute;inset:0;z-index:30;display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:18px;background:rgba(8,8,12,.0);opacity:0;pointer-events:none;transition:opacity .5s .25s, background .5s .25s}
  #reveal.on{opacity:1;background:rgba(8,8,12,.66);pointer-events:auto}
  #flash{position:absolute;inset:0;background:radial-gradient(circle at 50% 46%,rgba(255,238,200,.95),rgba(255,238,200,0) 55%);
    opacity:0;z-index:29;pointer-events:none}
  #flash.pop{animation:flashpop .55s ease-out}
  @keyframes flashpop{0%{opacity:0}18%{opacity:1}100%{opacity:0}}
  #prize{width:230px;filter:drop-shadow(0 10px 30px rgba(245,196,81,.35));
    transform:scale(.6) rotate(-4deg);transition:transform .55s .3s cubic-bezier(.3,1.5,.4,1)}
  #reveal.on #prize{transform:scale(1) rotate(-4deg)}
  #reveal h2{color:var(--gold);font-size:30px;letter-spacing:.2em;text-indent:.2em;font-weight:800;
    text-shadow:0 2px 14px rgba(245,196,81,.4)}
  #reveal p{color:#cfd2da;font-size:14px;letter-spacing:.06em}
  #again{margin-top:6px;padding:14px 44px;border-radius:99px;font-size:16px;letter-spacing:.3em;text-indent:.3em;
    background:linear-gradient(180deg,#c22a2f,#8e1418);box-shadow:0 6px 18px rgba(160,27,31,.45),inset 0 1px 0 rgba(255,255,255,.25)}

  @media (prefers-reduced-motion: reduce){
    #hint{animation:none}
    #body-wrap.fly{transition-duration:.2s}
  }
</style>
</head>

      <h2>撕開成功</h2>
      <p>這裡接開獎結果（已觸發 tearComplete 事件）</p>
      <button class="ui-btn" id="again">重新體驗</button>
    </div>
  </div>
</div>

<script>
/* ================= layout scale ================= */
const stage = document.getElementById('stage');
function fit(){
  const s = Math.min(innerWidth/393, innerHeight/843);
  stage.style.transform = `scale(${s})`;
}
addEventListener('resize', fit); fit();

/* ================= jagged tear edge ================= */
const EDGE_X = 20;                 // 撕裂線位置（票券寬度 %）
const stubEl=document.getElementById('stub'), bodyEl=document.getElementById('body');
const stubFib=document.getElementById('stub-fiber'), bodyFib=document.getElementById('body-fiber');
function makeEdge(){
  const pts=[]; const steps=14;
  for(let i=0;i<=steps;i++){
    const y=i/steps*100;
    const jitter=(i===0||i===steps)?0:(Math.random()*5-2.5);
    pts.push([EDGE_X+jitter, y]);
  }
  const seg=pts.map(p=>`${p[0].toFixed(2)}% ${p[1].toFixed(2)}%`);
  const stubPoly=`polygon(0% 0%, ${seg.join(',')}, 0% 100%)`;
  const bodyPoly=`polygon(${seg[0]}, 100% 0%, 100% 100%, ${seg[seg.length-1]}, ${seg.slice(1,-1).reverse().join(',')})`;
  [stubEl,stubFib].forEach(e=>e.style.clipPath=stubPoly);
  [bodyEl,bodyFib].forEach(e=>e.style.clipPath=bodyPoly);
}
makeEdge();

/* ================= audio (Web Audio 合成撕紙音) ================= */
let AC=null, muted=false;
const sndBtn=document.getElementById('snd');
sndBtn.addEventListener('click',()=>{muted=!muted;sndBtn.textContent=muted?'🔇':'🔊';});
function ctx(){
  if(muted) return null;
  if(!AC) AC=new (window.AudioContext||window.webkitAudioContext)();
  if(AC.state==='suspended') AC.resume();
  return AC;
}
function noiseBuffer(ac,dur){
  const b=ac.createBuffer(1,Math.max(1,ac.sampleRate*dur|0),ac.sampleRate);
  const d=b.getChannelData(0);
  for(let i=0;i<d.length;i++) d[i]=Math.random()*2-1;
  return b;
}
/* 拖曳中的細碎「啵啵」聲：模擬虛線孔一格格裂開 */
function crackle(intensity){
  const ac=ctx(); if(!ac) return;
  const t=ac.currentTime;
  const src=ac.createBufferSource(); src.buffer=noiseBuffer(ac,.07);
  const bp=ac.createBiquadFilter(); bp.type='bandpass';
  bp.frequency.value=1400+Math.random()*2600; bp.Q.value=1.2+Math.random()*2;
  const g=ac.createGain();
  g.gain.setValueAtTime(.1+.3*intensity,t);
  g.gain.exponentialRampToValueAtTime(.001,t+.06);
  src.connect(bp).connect(g).connect(ac.destination);
  src.start(t); src.stop(t+.08);
}
/* 撕開瞬間的大聲「唰——」 */
function bigRip(){
  const ac=ctx(); if(!ac) return;
  const t=ac.currentTime;
  for(let i=0;i<3;i++){
    const st=t+i*.055;
    const src=ac.createBufferSource(); src.buffer=noiseBuffer(ac,.34);
    const bp=ac.createBiquadFilter(); bp.type='bandpass'; bp.Q.value=.9;
    bp.frequency.setValueAtTime(3200-i*500,st);
    bp.frequency.exponentialRampToValueAtTime(520,st+.3);
    const g=ac.createGain();
    g.gain.setValueAtTime(.42-i*.09,st);
    g.gain.exponentialRampToValueAtTime(.001,st+.32);
    src.connect(bp).connect(g).connect(ac.destination);
    src.start(st); src.stop(st+.36);
  }
  const th=ac.createOscillator(), tg=ac.createGain();
  th.type='sine'; th.frequency.setValueAtTime(140,t); th.frequency.exponentialRampToValueAtTime(50,t+.18);
  tg.gain.setValueAtTime(.22,t); tg.gain.exponentialRampToValueAtTime(.001,t+.2);
  th.connect(tg).connect(ac.destination); th.start(t); th.stop(t+.22);
}

/* ================= drag / tear ================= */
const bodyWrap=document.getElementById('body-wrap');
const stubWrap=document.getElementById('stub-wrap');
const perf=document.getElementById('perf');
const label=document.getElementById('tear-label');
const hint=document.getElementById('hint');
const handB=document.getElementById('hand-back'), handF=document.getElementById('hand-front');
const THRESHOLD=150;
let dragging=false, startX=0, startY=0, dx=0, done=false, lastCrackle=0;

function setProgress(p, rawDx){
  const tx=rawDx, ty=p*p*26, rot=p*12;
  bodyWrap.style.transform=`translate(${tx}px,${ty}px) rotate(${rot}deg)`;
  stubWrap.style.transform=`translateX(${-p*7}px) rotate(${-p*5}deg)`;
  const hs=`translate(${-p*8}px,${p*4}px)`;
  handB.style.transform=hs; handF.style.transform=hs;
  perf.style.opacity=1-p*1.6;
  label.style.opacity=1-p*2;
}
function pt(e){ return e.touches?e.touches[0]:e; }

stage.addEventListener('pointerdown',e=>{
  if(done) return;
  const r=stage.getBoundingClientRect(), sc=r.width/393;
  const x=(e.clientX-r.left)/sc, y=(e.clientY-r.top)/sc;
  if(x<70||x>380||y<300||y>520) return;   // 只在票券附近啟動
  dragging=true; startX=e.clientX; dx=0; lastCrackle=0;
  hint.style.display='none';
  bodyWrap.classList.remove('spring');
  ctx(); // unlock audio
});
addEventListener('pointermove',e=>{
  if(!dragging||done) return;
  const sc=stage.getBoundingClientRect().width/393;
  dx=Math.max(0,(e.clientX-startX)/sc);
  const p=Math.min(1,dx/THRESHOLD);
  setProgress(p,dx*0.92);
  if(dx-lastCrackle>8){ crackle(p); lastCrackle=dx; }
  if(dx>=THRESHOLD) complete();
});
addEventListener('pointerup',()=>{
  if(!dragging||done) return;
  dragging=false;
  bodyWrap.classList.add('spring');
  setProgress(0,0);
});

/* ================= completion ================= */
function spawnBits(){
  if(matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const t=document.getElementById('ticket');
  const colors=['#f6efe2','#f6efe2','#b8262b','#e8dcc4'];
  for(let i=0;i<16;i++){
    const b=document.createElement('div'); b.className='bit';
    const s=3+Math.random()*5;
    b.style.width=s+'px'; b.style.height=s*(.6+Math.random())+'px';
    b.style.background=colors[i%colors.length];
    b.style.left=(t.offsetLeft+52)+'px';
    b.style.top=(t.offsetTop+20+Math.random()*90)+'px';
    stage.appendChild(b);
    const ang=(-.6+Math.random()*1.2), dist=60+Math.random()*130;
    b.animate([
      {transform:'translate(0,0) rotate(0deg)',opacity:1},
      {transform:`translate(${Math.cos(ang)*dist}px,${Math.sin(ang)*dist+90}px) rotate(${Math.random()*400-200}deg)`,opacity:0}
    ],{duration:700+Math.random()*500,easing:'cubic-bezier(.2,.6,.4,1)'}).onfinish=()=>b.remove();
  }
}
function complete(skip=false){
  if(done) return; done=true; dragging=false;
  if(!skip){
    bigRip();
    spawnBits();
    bodyWrap.classList.add('fly');
    bodyWrap.style.transform='translate(530px,150px) rotate(40deg)';
    bodyWrap.style.opacity='0';
    stubWrap.style.transform='translateX(-14px) rotate(-9deg)';
    const hs='translate(-16px,8px) rotate(-3deg)';
    handB.style.transform=hs; handF.style.transform=hs;
    document.getElementById('flash').classList.add('pop');
  }
  perf.style.opacity=0; label.style.opacity=0; hint.style.display='none';
  window.dispatchEvent(new CustomEvent('tearComplete'));   // ← 開獎流程接這裡
  setTimeout(()=>document.getElementById('reveal').classList.add('on'), skip?50:520);
}
document.getElementById('skip').addEventListener('click',()=>complete(true));
document.getElementById('again').addEventListener('click',()=>{
  done=false; dx=0;
  document.getElementById('reveal').classList.remove('on');
  document.getElementById('flash').classList.remove('pop');
  bodyWrap.classList.remove('fly'); bodyWrap.classList.add('spring');
  bodyWrap.style.opacity='1';
  makeEdge();
  setProgress(0,0);
  setTimeout(()=>{hint.style.display='block';},400);
});
</script>
</body>
</html>
