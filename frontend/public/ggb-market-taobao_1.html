<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>吉吉比商城</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=Oswald:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F2F2F2;--card:#FFF;--line:#EEE;--line2:#E5E5E5;
  --tao1:#FF7B00;--tao2:#FF2D46;--red:#FF0036;--orange:#FF6A00;
  --txt:#1B1B1B;--sub:#8C8C8C;--mute:#BFBFBF;--tm:#111;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{background:#DADADA;font-family:"Noto Sans TC",system-ui,sans-serif;color:var(--txt);display:flex;justify-content:center;align-items:center;font-size:15px}
button{font-family:inherit;border:0;background:none;color:inherit;cursor:pointer;padding:0}
input{font-family:inherit}
.num{font-family:"Oswald",sans-serif;font-weight:600}
:focus-visible{outline:2px solid var(--orange);outline-offset:2px;border-radius:6px}
.phone{width:400px;height:min(860px,100vh);background:var(--bg);position:relative;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 24px 70px rgba(0,0,0,.35)}
@media(min-width:440px){.phone{border-radius:30px}}
@media(max-width:439px){body{align-items:stretch}.phone{width:100%;height:100dvh}}

/* header */
.hdr{flex-shrink:0;background:linear-gradient(100deg,var(--tao1),var(--tao2));padding:12px;color:#fff;overflow:hidden}
.hdr.plain{background:var(--card);color:var(--txt);border-bottom:1px solid var(--line);padding:14px 16px}
.hdr.plain h1{font-size:17px;font-weight:700;margin:0;text-align:center}
.srch{display:flex;align-items:center;gap:9px;width:100%;max-width:100%}
.logo{font-size:16.5px;font-weight:900;letter-spacing:-.5px;flex-shrink:0;white-space:nowrap}
.sbox{flex:1 1 0;min-width:0;background:#fff;border-radius:17px;height:34px;display:flex;align-items:center;padding:0 4px 0 11px;gap:6px;overflow:hidden}
.sbox svg{flex-shrink:0}
.sboxt{flex:1 1 0;min-width:0;color:var(--mute);font-size:12.5px;text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sgo{flex:0 0 auto;background:linear-gradient(100deg,var(--tao1),var(--tao2));color:#fff;font-size:12px;font-weight:700;padding:0 13px;height:26px;line-height:26px;border-radius:13px;white-space:nowrap}

/* scroll */
.screen{flex:1;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;padding-bottom:16px}
.screen::-webkit-scrollbar{width:0}

/* category icons */
.cats{background:var(--card);display:flex;padding:14px 4px 12px;margin-bottom:8px}
.cats button{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:11px;color:var(--txt)}
.cats .ci{width:42px;height:42px;border-radius:50%;display:grid;place-items:center}
.cats .ci svg{width:23px;height:23px}
.cats button[aria-pressed="true"]{color:var(--red);font-weight:700}
.cats button[aria-pressed="true"] .ci{box-shadow:0 0 0 2px var(--red)}

/* banner */
.bcard{flex:0 0 108px;background:#FFF7F2;border:1px solid #FFE3D2;border-radius:10px;padding:12px 10px;display:flex;flex-direction:column;align-items:center;gap:5px}
.bmark{width:38px;height:38px;border-radius:50%;background:linear-gradient(100deg,var(--tao1),var(--tao2));color:#fff;font-weight:900;font-size:17px;display:grid;place-items:center}
.bn{font-size:12px;font-weight:700}
.bd{font-size:10px;color:var(--sub)}
.mini.rank{background:linear-gradient(100deg,#F5C24B,#D89B2C);color:#3A2604;font-weight:900;padding:1px 6px}

/* waterfall grid */
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:8px 10px 0}
.pcard{background:var(--card);border-radius:10px;overflow:hidden;text-align:left;display:flex;flex-direction:column}
.pcard:active{opacity:.85}
.pimg{aspect-ratio:1/1;display:grid;place-items:center;position:relative}
.pimg svg{width:72%;height:72%}
.badge{position:absolute;left:0;top:0;background:linear-gradient(100deg,var(--tao1),var(--tao2));color:#fff;font-size:10px;font-weight:700;padding:2px 7px;border-radius:0 0 8px 0}
.badge.off{background:#111}
.badge.ft{background:linear-gradient(100deg,#F5C24B,#D89B2C);color:#3A2604}
.heroC{position:relative;margin:8px 10px;border-radius:12px;overflow:hidden;height:100px;background:#fff}
.hslide{position:absolute;inset:0;display:flex;align-items:stretch;gap:0;padding:0;opacity:0;transition:opacity .5s;text-align:left}
.hslide.on{opacity:1}
.hart{width:100px;height:100%;border-radius:0;display:grid;place-items:center;flex-shrink:0}
.hart svg{width:72%;height:72%}
.htx{flex:1;min-width:0;padding:11px 12px 0 12px;display:block}
.hslide h3{margin:0 0 3px;font-size:13px;font-weight:900;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.hslide p{margin:0;font-size:10.5px;color:var(--sub)}
.hprice{color:var(--red);font-family:"Oswald";font-weight:600;font-size:18px;margin-top:3px;display:block}
.hdots{position:absolute;right:9px;bottom:7px;display:flex;gap:4px}
.hdots i{width:5px;height:5px;border-radius:3px;background:#DDD;display:block}
.hdots i.on{background:var(--red);width:12px}
.adtag{position:absolute;left:0;top:0;background:rgba(0,0,0,.38);color:#fff;font-size:8.5px;padding:2px 6px;border-radius:0 0 6px 0;z-index:2}
.strip{background:#fff;margin-top:8px;padding:12px 0 12px 10px;position:relative}
.striphd{display:flex;align-items:center;gap:7px;padding-right:10px;margin-bottom:10px}
.striphd b{font-size:14px}
.striphd .tagline{font-size:11px;color:var(--sub)}
.striphd .more{margin-left:auto;font-size:11.5px;color:var(--sub);padding:3px 0 3px 10px}
.striphd .more:active{color:var(--red)}
.srow{display:flex;gap:8px;overflow-x:auto;padding-right:10px}
.srow::-webkit-scrollbar{height:0}
.scard{flex:0 0 104px;text-align:left}
.scard .si{width:104px;height:104px;border-radius:8px;display:grid;place-items:center;position:relative}
.scard .si svg{width:74%;height:74%}
.scard .st{font-size:11.5px;line-height:1.35;margin-top:5px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.scard .sp{color:var(--red);font-family:"Oswald";font-weight:600;font-size:14px;margin-top:2px}
.mini{position:absolute;left:0;top:0;background:rgba(0,0,0,.4);color:#fff;font-size:8.5px;padding:1px 5px;border-radius:0 0 6px 0}
.dban{margin:8px 10px 0;border-radius:12px;background:linear-gradient(100deg,#FFEDD5,#FFE0E4);padding:13px 14px;display:flex;align-items:center;gap:11px}
.dban b{font-size:13.5px;display:block}
.dban small{font-size:11.5px;color:#9A6A44}
.dban .go{margin-left:auto;background:linear-gradient(100deg,var(--tao1),var(--tao2));color:#fff;font-size:12px;font-weight:700;padding:7px 13px;border-radius:16px;white-space:nowrap}
.mebadges{display:flex;gap:5px;flex-wrap:wrap}
.bdg{font-size:10px;font-weight:700;padding:2px 7px;border-radius:10px;background:rgba(255,255,255,.22);border:1px solid rgba(255,255,255,.4)}
.bdg.gold{background:linear-gradient(100deg,#FFE9A8,#F5C24B);color:#5A3E05;border-color:#F5C24B}
.bdg.verify{background:#fff;color:#3FA34D;border-color:#fff}
.repbar{margin-top:14px;background:rgba(0,0,0,.14);border-radius:10px;padding:10px 12px}
.repbar .l{display:flex;justify-content:space-between;font-size:11px;margin-bottom:6px}
.repbar .track{height:5px;border-radius:4px;background:rgba(255,255,255,.28);overflow:hidden}
.repbar .fill{height:100%;background:#fff;border-radius:4px}
.slotrow{width:100%;display:flex;align-items:center;gap:11px;padding:13px 0;border-bottom:1px solid var(--line);text-align:left}
.slotrow:last-child{border-bottom:0}
.slotrow .ic{width:38px;height:38px;border-radius:9px;background:#FFF4EC;display:grid;place-items:center;flex-shrink:0}
.slotrow b{font-size:13.5px;display:block}
.slotrow small{font-size:11px;color:var(--sub)}
.slotrow .pr{margin-left:auto;text-align:right;flex-shrink:0}
.slotrow .pr .n{font-family:"Oswald";font-weight:600;color:var(--red);font-size:15px}
.slotrow .pr .s{font-size:10.5px;color:var(--sub)}
.admin{background:#F3EEE6;border:1px solid #E3D7C4;border-radius:8px;padding:11px 12px;font-size:11.5px;color:#7A6242;line-height:1.6}
.admin b{display:block;color:#4A3524;font-size:12.5px;margin-bottom:2px}
.sprow{border:1px solid var(--line2);border-radius:10px;padding:10px;margin-bottom:9px;background:#FCFCFC}
.addbtn{margin-top:2px}
.sprow-hd{display:flex;align-items:center;gap:8px}
.sprow-hd .idx{width:20px;height:20px;border-radius:50%;background:var(--red);color:#fff;font-size:11px;font-weight:700;display:grid;place-items:center;flex-shrink:0}
.sprow-hd .nm{flex:1;min-width:0;padding:9px;background:#fff}
.sdel{width:26px;flex-shrink:0;color:var(--mute);font-size:13px}
.sprow-bd{display:none}
.sprow-bd label{display:block}
.sprow-bd label span{display:block;font-size:11px;color:var(--sub);margin-bottom:4px}
.sprow-bd .fin{width:78px;padding:8px;text-align:center;background:#fff}
.sprev{flex:1;text-align:right;font-size:11.5px;color:var(--sub);padding-bottom:9px}
.sprev b{display:block;color:var(--red);font-family:"Oswald";font-weight:600;font-size:15px}
.addbtn{width:100%;margin-top:2px;padding:11px;border:1px dashed var(--line2);border-radius:10px;color:var(--red);font-size:13.5px;font-weight:700;background:#fff}
.flatbox{display:block}
.gchips{display:flex;gap:7px;flex-wrap:wrap}
.gchip{display:inline-flex;align-items:center;gap:2px;border:1px solid var(--line2);border-radius:16px;padding:4px 6px 4px 12px;background:#fff}
.gchip.on{border-color:var(--red);background:#FFF4F5}
.gchip b{font-size:13px;font-weight:700;color:var(--txt);padding:2px 0}
.gchip.on b{color:var(--red)}
.gchip button{width:20px;height:20px;border-radius:50%;color:var(--mute);font-size:11px}
.gadd{border:1px dashed #FFC9B5;border-radius:16px;padding:6px 13px;font-size:12.5px;font-weight:700;color:var(--orange);background:#FFF9F6}
.gsec{border-top:1px solid var(--line);padding-top:12px;margin-top:14px}
.gsec:first-child{border-top:0;padding-top:0;margin-top:0}
.gsechd{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.gsechd .gnum{width:20px;height:20px;border-radius:50%;background:var(--red);color:#fff;font-size:11px;font-weight:700;display:grid;place-items:center;flex-shrink:0}
.gname{flex:1;min-width:0;border:0;border-bottom:1px dashed var(--line2);background:transparent;font-size:14px;font-weight:700;padding:4px 2px;outline:none}
.gname:focus{border-bottom-color:var(--red)}
.gcount{margin-left:auto;font-size:11px;color:var(--sub)}
.glist{padding-left:28px}
.ir{display:flex;gap:9px;align-items:flex-start;padding:8px 0;border-bottom:1px dashed var(--line)}
.flatbox .ir:first-child{padding-top:0}
.irimg{width:50px;height:50px;flex-shrink:0;border:1px dashed var(--line2);border-radius:8px;background:#FAFAFA;display:grid;place-items:center;font-size:10px;color:var(--mute);line-height:1.3;overflow:hidden}
.irimg svg{width:84%;height:84%}
.irf{flex:1;min-width:0}
.irf .fin{padding:8px;background:#F7F7F7}
.irn{display:flex;gap:8px;margin-top:6px}
.irn label{flex:1;min-width:0}
.irn label span{display:block;font-size:10.5px;color:var(--sub);margin-bottom:3px}
.irn .fin{width:100%;padding:7px;text-align:center}
.irdel{width:22px;height:22px;flex-shrink:0;color:var(--mute);font-size:12px;border-radius:50%;background:#F4F4F4;margin-top:2px}
.addsku{width:100%;padding:8px;border:1px dashed #FFD3C4;border-radius:8px;color:var(--orange);font-size:12.5px;font-weight:700;background:transparent;margin-top:4px}
.sprow input[type=number]::-webkit-inner-spin-button,.sprow input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
.spmeta{font-size:11.5px;color:var(--sub);margin-top:4px}
.skurow{width:100%;display:flex;align-items:center;gap:10px;border:1px solid var(--line2);border-radius:10px;padding:8px;margin-bottom:8px;background:#fff;text-align:left}
.skurow[aria-pressed="true"]{border-color:var(--red);background:#FFF4F5}
.skurow[disabled]{opacity:.45}
.skurow .sth{width:46px;height:46px;border-radius:8px;display:grid;place-items:center;flex-shrink:0}
.skurow .sth svg{width:78%;height:78%}
.skurow .stx{flex:1;min-width:0}
.skurow .stx b{display:block;font-size:13px}
.skurow .stx span{font-size:11px;color:var(--sub)}
.skurow .spr{font-family:"Oswald";font-weight:600;color:var(--red);font-size:15px;flex-shrink:0}
.shophero{background:linear-gradient(100deg,var(--tao1),var(--tao2));color:#fff;padding:16px}
.shophero-in{display:flex;align-items:center;gap:11px}
.shophero .ghostbtn{background:transparent;border-color:rgba(255,255,255,.6);color:#fff}
.uav.big{width:56px;height:56px;border:2px solid rgba(255,255,255,.6)}
.uav.sm{width:28px;height:28px;flex-shrink:0}
.shopsub{font-size:11.5px;opacity:.9;margin-top:3px}
.shopstat{display:flex;margin-top:14px;background:rgba(0,0,0,.14);border-radius:10px;padding:10px 0}
.shopstat div{flex:1;text-align:center}
.shopstat b{display:block;font-family:"Oswald";font-weight:600;font-size:15px}
.shopstat span{font-size:10px;opacity:.85}
.clrow{width:100%;display:flex;align-items:center;gap:11px;padding:13px 0;border-bottom:1px solid var(--line);text-align:left}
.clrow:last-child{border-bottom:0}
.cltx{flex:1;min-width:0}
.cltx b{display:block;font-size:14px}
.cltx span{display:block;font-size:11.5px;color:var(--sub);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:2px}
.unread{background:var(--red);color:#fff;font-size:10px;font-weight:700;min-width:18px;height:18px;border-radius:9px;display:grid;place-items:center;padding:0 5px;flex-shrink:0}
.soact{display:flex;gap:8px;justify-content:flex-end;margin-top:10px}
.sobtn{background:linear-gradient(100deg,var(--tao1),var(--tao2));color:#fff;font-size:12.5px;font-weight:700;padding:7px 16px;border-radius:16px}
.chatbox{background:var(--bg);padding:14px 12px;min-height:280px;max-height:44vh;overflow-y:auto}
.chatbox::-webkit-scrollbar{width:0}
.bub{display:flex;gap:7px;margin-bottom:11px;align-items:flex-start}
.bub .tx{max-width:74%;padding:9px 12px;border-radius:14px;font-size:13.5px;line-height:1.5;background:#fff;border:1px solid var(--line)}
.bub.me{flex-direction:row-reverse}
.bub.me .tx{background:linear-gradient(100deg,var(--tao1),var(--tao2));color:#fff;border:0}
.chatctx{background:#fff;border-radius:10px;padding:10px;margin-bottom:12px;border:1px solid var(--line)}
.quick{display:flex;gap:6px;overflow-x:auto;padding:10px 12px;background:#fff;border-top:1px solid var(--line)}
.quick::-webkit-scrollbar{height:0}
.qk{flex:0 0 auto;border:1px solid var(--line2);border-radius:15px;padding:6px 12px;font-size:12.5px;background:#fff;white-space:nowrap}
.chatbar{display:flex;gap:8px;padding:10px 12px 14px;background:#fff;position:sticky;bottom:0}
.chatbar .fin{flex:1;border-radius:18px}
.sendbtn{flex-shrink:0;background:linear-gradient(100deg,var(--tao1),var(--tao2));color:#fff;font-weight:700;font-size:13.5px;padding:0 18px;border-radius:18px}
.opts{display:flex;gap:7px;flex-wrap:wrap}
.opt{border:1px solid var(--line2);border-radius:8px;padding:9px 13px;font-size:13px;background:#F7F7F7}
.opt[aria-pressed="true"]{border-color:var(--red);background:#FFF4F5;color:var(--red);font-weight:700}
.opt[disabled]{opacity:.45;text-decoration:line-through}
.qty{display:flex;align-items:center}
.qty button{width:34px;height:32px;border:1px solid var(--line2);background:#F7F7F7;font-size:15px}
.qty button:first-of-type{border-radius:7px 0 0 7px}
.qty button:last-of-type{border-radius:0 7px 7px 0}
.qty span{min-width:46px;height:32px;line-height:32px;text-align:center;border-top:1px solid var(--line2);border-bottom:1px solid var(--line2);font-size:14px;font-weight:700}
.qty .qmax{border:0;min-width:0;margin-left:10px;font-size:11.5px;color:var(--sub);font-weight:400;height:auto;line-height:1}
.kwchips{display:flex;gap:6px;flex-wrap:wrap}
.kw{border:1px solid var(--line2);border-radius:14px;padding:6px 11px;font-size:12.5px;background:#fff}
.kw[aria-pressed="true"]{border-color:var(--red);color:var(--red);background:#FFF4F5;font-weight:700}
.upsell{background:linear-gradient(100deg,#2C2416,#4A3A1C);color:#fff;border-radius:10px;margin:0 10px 8px;padding:14px}
.upsell b{font-size:14px;display:block;margin-bottom:3px}
.upsell p{margin:0;font-size:11.5px;color:#D9C9A8}
.upsell .go{margin-top:10px;background:linear-gradient(100deg,#F5C24B,#D89B2C);color:#3A2604;font-size:12.5px;font-weight:700;padding:8px 0;border-radius:18px;width:100%;display:block}
.btn.gold{background:linear-gradient(100deg,#F5C24B,#D89B2C);color:#3A2604}
.mrow .hot{background:#FFF4F5;color:var(--red);font-size:10px;font-weight:700;padding:1px 6px;border-radius:9px}
.pcard.ft{box-shadow:0 0 0 1.5px #EFCB74}
.adlbl{position:absolute;right:5px;bottom:5px;background:rgba(0,0,0,.42);color:#fff;font-size:9px;padding:1px 5px;border-radius:3px}
.pbody{padding:7px 8px 8px}
.ptitle{font-size:12.5px;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;margin-bottom:4px;height:2.7em}
.pprice{color:var(--red);display:flex;align-items:baseline;gap:1px}
.pprice i{font-style:normal;font-size:12px;font-weight:700}
.pprice b{font-family:"Oswald";font-weight:600;font-size:19px;line-height:1}
.pprice .from{font-size:10.5px;color:var(--sub);margin-left:2px;align-self:flex-end}
.dep{margin-left:auto;font-size:10px;font-weight:700;color:var(--red);background:#FFF4F5;border:1px solid #FFD3D9;border-radius:3px;padding:1px 5px;white-space:nowrap}
.dep.off{color:#B4884A;background:#FDF7EC;border-color:#EBD9BE}
.pshop{display:flex;align-items:center;gap:4px;font-size:10.5px;color:var(--sub);margin-top:5px}
.pshop .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dot{width:14px;height:14px;border-radius:50%;flex-shrink:0}
.tags{display:flex;gap:4px;margin-top:5px;flex-wrap:nowrap;overflow:hidden;height:16px}
.tg{font-size:10px;padding:1px 5px;border-radius:3px;border:1px solid;white-space:nowrap}
.tg--dep{color:var(--red);border-color:#FFD3D9;background:#FFF4F5}
.tg--pay{color:var(--sub);border-color:var(--line2)}
.tg--off{color:#B4884A;border-color:#EBD9BE;background:#FDF7EC}
.lvl{font-size:10px;font-weight:700;padding:2px 7px;border-radius:10px;background:linear-gradient(100deg,#FFE9A8,#F5C24B);color:#5A3E05;border:1px solid #F5C24B;white-space:nowrap}
.lvl.g2{background:linear-gradient(100deg,#EDF1F4,#C6D0D8);color:#41525E;border-color:#C6D0D8}
.lvl.g1{background:#F2F2F2;color:#7A7A7A;border-color:#E2E2E2}

/* sheet */
.scrim{position:absolute;inset:0;background:rgba(0,0,0,.45);z-index:20;opacity:0;pointer-events:none;transition:.2s}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:absolute;left:0;right:0;bottom:0;max-height:93%;background:var(--bg);border-radius:14px 14px 0 0;z-index:21;transform:translateY(101%);transition:transform .28s cubic-bezier(.2,.85,.25,1);display:flex;flex-direction:column}
.sheet.on{transform:none}
.shd{background:var(--card);padding:14px 16px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--line);border-radius:14px 14px 0 0}
.shd h3{margin:0;font-size:16px;font-weight:700;flex:1}

 {id:1,t:"航海王 一番賞 A賞 索隆 三刀流 造型公仔",specs:{n:"賞等",o:[{v:"A賞",items:[{n:"索隆 三刀流 造型公仔",p:2680,q:1,k:"fig"},{n:"魯夫 五檔 造型公仔",p:2980,q:1,k:"fig"}]},{v:"B賞",items:[{n:"香吉士 壓克力立牌",p:880,q:3,k:"card"},{n:"娜美 壓克力立牌",p:820,q:2,k:"card"}]},{v:"最後一賞",items:[{n:"艾斯 特典公仔",p:3600,q:1,k:"fig"}]}]},p:2680,ship:60,k:"fig",cond:"未拆",s:"阿凱の抽物間",v:1,pays:["銀行轉帳","LINE Pay"],rate:99.1,rel:8,done:412,q:1,sold:86},

function pcard(o){
  return `<button class="pcard${o.ad?" ft":""}" data-${o.kind}="${o.id}">
    <div class="pimg" style="background:${o.bg}">${o.svg}${o.badge}</div>

      <div class="pprice"><i>NT$</i><b>${nt(o.p)}</b>${o.from?'<span class="from">起</span>':""}${o.right||""}</div>
      <div class="pshop"><span class="dot" style="background:${o.shopColor}"></span><span class="nm">${esc(o.shop)}</span>${o.lvl||""}</div>
      <div class="tags">${o.tags}</div>
    </div></button>`;
}
function feed(list,build,pool){
  // 右欄第一格 = 精選版位，之後每 8 格再插一次；不與相鄰或已出現過的廣告重複
  const out=[],seen=[];let f=0,prev=null;
  const pickAd=()=>{
    for(let n=0;n<pool.length;n++){
      const c=pool[(f+n)%pool.length];
      if(c!==prev&&seen.indexOf(c)<0){f=(f+n+1)%pool.length;return c}
    }
    return null;
  };
  list.forEach(it=>{
    if(pool.length&&(out.length===1||(out.length>1&&(out.length-1)%8===0))){
      const ad=pickAd();
      if(ad){out.push(build(ad,true));seen.push(ad)}
    }
    out.push(build(it,false));prev=it;
  });
  if(out.length===1&&pool.length)out.push(build(pool[0],true));
  return out.join("");
}

  ${payChips(myPays,"data-p")}</div>
  <div class="blk"><div class="secttl">保證金</div>
    <div class="calcbox"><div class="l">賣出時收取</div><div class="v" id="gv">填售價後顯示</div>
    <div class="s" id="gs">你是「${t.n}」賣家，保證金為售價 ${t.ratio*100}%</div></div></div>
  <div class="blk"><div class="secttl">推廣（選填）</div>
    <button class="btn2" data-go="ads" style="margin-top:0">前往廣告中心 ›</button>
    <button class="btn" data-submit="1">送出審核</button></div>`);
  const upd=()=>{
    const p=+$("sP").value||0,need=Math.ceil(p*t.ratio),v=$("gv"),sh=curShip();
    $("shSum").textContent=p?`買家結帳 NT$${nt(p+sh)}（售價 ${nt(p)}${sh?" + 運費 "+nt(sh):"，免運費"}）`:"買家結帳金額 = 售價 + 運費";
    if(!p){v.textContent="填售價後顯示";v.style.color="var(--orange)";$("gs").textContent=`你是「${t.n}」賣家，保證金為售價 ${t.ratio*100}%`;return}
    if(p>t.max){v.textContent="超過可賣價格";v.style.color="var(--red)";$("gs").textContent=`「${t.n}」單件最高賣 ${nt(t.max)}，多賣幾單升級後解鎖`}
    else{v.textContent=nt(need)+" G";v.style.color="var(--orange)";$("gs").textContent="運費不計入保證金。買家確認收貨後全額退還"}
  };
  const itemRow=(m,i,j)=>{
    const key=i+"."+j;
    return `<div class="ir">
      <button class="irimg" data-img="${key}">${m.k?art(m.k,(i+1)*7+j).s:'<span>＋<br>圖</span>'}</button>
      <div class="irf">
        <input class="fin" data-in="${key}" placeholder="品項名稱，例：索隆 三刀流" value="${esc(m.n)}">
        <div class="irn">
          <label><span>價格 NT$</span><input class="fin" data-ip="${key}" type="number" inputmode="numeric" value="${m.p||""}" placeholder="0"></label>
          <label><span>庫存</span><input class="fin" data-iq="${key}" type="number" inputmode="numeric" value="${m.q}"></label>
        </div></div>
      <button class="irdel" data-idel="${key}">✕</button></div>`;
  };
  const drawRows=()=>{
    const chips=$("spChips");
    if(!useSpec){
      chips.style.display="none";
      $("spRows").innerHTML=`<div class="flatbox">${specTree[0].items.map((m,j)=>itemRow(m,0,j)).join("")}</div>`;
      $("spAdd").textContent="＋ 新增選項";
    }else{
      chips.style.display="block";
      chips.innerHTML=`<label class="f">規格</label><div class="gchips">
        ${specTree.map((o,i)=>`<span class="gchip${i===gSel?" on":""}" data-gsel="${i}">
          <b>${esc(o.v||"規格 "+(i+1))}</b>
          <button data-odel="${i}">✕</button></span>`).join("")}
        <button class="gadd" data-gadd="1">＋ 新增規格</button></div>`;
      $("spRows").innerHTML=specTree.map((o,i)=>`<div class="gsec">
        <div class="gsechd"><span class="gnum">${i+1}</span>
          <input class="gname" data-ov="${i}" placeholder="規格 ${i+1}" value="${esc(o.v)}">
          <span class="gcount">${o.items.length} 個選項</span></div>
        <div class="glist">${o.items.map((m,j)=>itemRow(m,i,j)).join("")}
          <button class="addsku" data-iadd="${i}">＋ 新增選項</button></div>
      </div>`).join("");
      $("spAdd").style.display="none";
    }
    if(!useSpec)$("spAdd").style.display="block";
  };
  drawRows();
  $("spMode").addEventListener("click",e=>{
    const b=e.target.closest("[data-spm]");if(!b)return;
    useSpec=b.dataset.spm==="1";
    document.querySelectorAll("#spMode .pick").forEach(x=>x.setAttribute("aria-pressed",(x.dataset.spm==="1")===useSpec));
    if(useSpec&&specTree.length<2&&!specTree[0].v)specTree[0].v="";
    drawRows();
  });
  $("spChips").addEventListener("click",e=>{
    const b=e.target.closest("[data-gadd],[data-odel],[data-gsel]");if(!b)return;
    const d=b.dataset;
    if(d.gadd){if(specTree.length>=8){toast("最多 8 個規格");return}specTree.push({v:"",items:[{n:"",p:0,q:1}]});gSel=specTree.length-1;}
    else if(d.odel!==undefined){
      if(specTree.length<=1){toast("至少保留一個規格");return}
      specTree.splice(+d.odel,1);gSel=0;
    }else if(d.gsel!==undefined){
      gSel=+d.gsel;drawRows();
      const sec=document.querySelectorAll(".gsec")[gSel];
      if(sec)sec.scrollIntoView({behavior:"smooth",block:"start"});
      return;
    }
    drawRows();
  });
  const KS=["fig","card","box","cap","plush"];
  $("spAdd").addEventListener("click",()=>{
    if(specTree[0].items.length>=12){toast("最多 12 個選項");return}
    specTree[0].items.push({n:"",p:0,q:1});
    drawRows();
  });
  $("spRows").addEventListener("click",e=>{
    const b=e.target.closest("[data-idel],[data-iadd],[data-img]");if(!b)return;
    const d=b.dataset;
    if(d.iadd!==undefined){
      const o=specTree[+d.iadd];if(o.items.length>=8){toast("單一規格最多 8 個選項");return}
      o.items.push({n:"",p:0,q:1});
    }else if(d.idel!==undefined){
      const [i,j]=d.idel.split(".").map(Number);
      if(specTree[i].items.length<=1){toast("至少保留一個選項");return}
      specTree[i].items.splice(j,1);
    }else if(d.img!==undefined){
      const [i,j]=d.img.split(".").map(Number),m=specTree[i].items[j];
      m.k=KS[(KS.indexOf(m.k)+1)%KS.length];
    }
    drawRows();
  });
  $("spRows").addEventListener("input",e=>{
    const d=e.target.dataset,v=e.target.value;
    if(d.ov!==undefined){
      specTree[+d.ov].v=v;
      const chip=document.querySelectorAll(".gchip b")[+d.ov];
      if(chip)chip.textContent=v||("規格 "+(+d.ov+1));
    }
    else if(d.in!==undefined){const [i,j]=d.in.split(".").map(Number);specTree[i].items[j].n=v}
    else if(d.ip!==undefined){const [i,j]=d.ip.split(".").map(Number);specTree[i].items[j].p=+v||0}
    else if(d.iq!==undefined){const [i,j]=d.iq.split(".").map(Number);specTree[i].items[j].q=+v||0}
  });

  $("sP").addEventListener("input",()=>{upd();if(useSpec)drawRows()});
  $("sSh").addEventListener("input",()=>{myShip=+$("sSh").value||0;upd()});
  $("shPick").addEventListener("click",e=>{
    const b=e.target.closest("[data-sh]");if(!b)return;
    const v=+b.dataset.sh;
    document.querySelectorAll("#shPick .pick").forEach(x=>x.setAttribute("aria-pressed",x===b));
    if(v===-1){$("sSh").style.display="block";myShip=+$("sSh").value||0;$("sSh").focus()}
    else{$("sSh").style.display="none";myShip=v}
    upd();
  });
}
const curShip=()=>myShip;
function depInfo(){
  const my=tierOf(ME);
  sheet("保證金規則",`
  <div class="blk first"><div class="secttl">怎麼運作</div>
    <div class="kv"><span>上架時</span><span style="color:#3FA34D">不扣</span></div>
    <div class="kv"><span>賣出時</span><span>依售價收一筆 G幣</span></div>
    <div class="kv"><span>買家確認收貨</span><span style="color:#3FA34D">全額退還</span></div>
    <div class="kv"><span>你沒出貨</span><span style="color:var(--red)">保證金賠給買家</span></div>
    </div>
  <div class="blk"><div class="secttl">等級與比例</div>
    <table class="t"><tr><th>等級</th><th>條件</th><th>保證金</th><th>單件最高賣</th></tr>
    ${TIERS.slice().reverse().map(t=>`<tr class="${t.k===my.k?"me":""}"><td>${t.n}</td><td style="color:var(--sub)">${t.cond}</td><td>售價 ${t.ratio*100}%</td><td>${nt(t.max)}</td></tr>`).join("")}</table>
    </div>`);
}
function payCfg(){
  sheet("收款設定",`<div class="blk first"><div class="secttl">可複選</div>
  ${payChips(myPays,"data-p2")}
  <button class="btn" data-x="1">儲存</button></div>`);
}

$("hdr").addEventListener("click",e=>{if(e.target.closest("[data-search]"))searchSheet("")});
$("screen").addEventListener("click",e=>{
  const b=e.target.closest("[data-seg],[data-c2c],[data-b2c],[data-ord],[data-go],[data-sim],[data-promo],[data-more]");if(!b)return;
  const d=b.dataset;
  if(d.seg){seg=d.seg;render()}
  else if(d.more){moreSheet(d.more);return}
  else if(d.c2c)itemC2C(+d.c2c);
  else if(d.b2c)itemB2C(+d.b2c);
  else if(d.ord)openOrder(d.ord);
  else if(d.go==="sell")sellForm();
  else if(d.go==="ads")adCenter();
  else if(d.go==="chats")chatList();
  else if(d.go==="notis"){notiSheet();return}
  else if(d.go==="sorders")sellOrdersSheet();
  else if(d.go==="pro")goPro();
  else if(d.go==="dep")depInfo();
  else if(d.go==="paycfg")payCfg();
  else if(d.sim!==undefined){
    const m=myList[+d.sim];
    if(!m.locked){
      if(m.need>gbal-locked){toast("G幣不足，請先儲值");return}
      m.locked=true;locked+=m.need;toast(`買家下單，收保證金 ${nt(m.need)}G`);
    }else{m.locked=false;locked-=m.need;toast(`保證金 ${nt(m.need)}G 已退還`)}
    render();
  }
  else if(d.promo!==undefined){promoFor=+d.promo;adCenter()}
});
$("shBody").addEventListener("click",e=>{
  const b=e.target.closest("[data-buy],[data-cbuy],[data-ecpay],[data-paid],[data-ship],[data-late],[data-claim],[data-recv],[data-pack],[data-oship],[data-refund],[data-submit],[data-p],[data-p2],[data-pay],[data-x],[data-c2c],[data-b2c],[data-q],[data-slot],[data-ad],[data-adlen],[data-kw],[data-adbuy],[data-go],[data-prob],[data-opt],[data-sku],[data-q],[data-confirm],[data-shop],[data-chat],[data-say],[data-send],[data-sot],[data-soship],[data-sorecv],[data-noti],[data-go]");
  if(!b)return;const d=b.dataset;
  const o=orders.find(x=>x.no===(d.paid||d.ship||d.late||d.claim||d.recv||d.pack||d.oship||d.refund));
  if(d.buy)specSheet("c2c",+d.buy);
  else if(d.cbuy)specSheet("b2c",+d.cbuy);
  else if(d.opt!==undefined&&!b.disabled){buyCtx.oi=+d.opt;buyCtx.ii=0;buyCtx.qty=1;spUpd()}
  else if(d.sku!==undefined&&!b.disabled){buyCtx.ii=+d.sku;buyCtx.qty=1;spUpd()}
  else if(d.q){const it=(buyCtx.kind==="c2c"?C2C:B2C).find(x=>x.id===buyCtx.id);const o=curSku();buyCtx.qty=Math.min(o.q,Math.max(1,buyCtx.qty+(+d.q)));spUpd()}
  else if(d.confirm)confirmBuy();
  else if(d.noti!==undefined){const n=NOTIS[+d.noti];if(n.go==="sorders")sellOrdersSheet();else if(n.go==="ads")adCenter();else close();render();return}
  else if(d.shop){shopSheet(d.shop);return}
  else if(d.sot!==undefined){soTab=+d.sot;sellOrdersSheet();return}
  else if(d.soship){const o=sellOrders.find(x=>x.no===d.soship);o.st=1;o.late=false;o.track="F"+String(Math.random()).slice(2,11);toast("已建立物流單");sellOrdersSheet();render();return}
  else if(d.sorecv){const o=sellOrders.find(x=>x.no===d.sorecv);o.st=2;toast(`保證金 ${nt(o.dep)}G 已退還`);sellOrdersSheet();render();return}
  else if(d.chat){const o=d.ord2?orders.find(x=>x.no===d.ord2):null;chatSheet(d.chat,o);return}
  else if(d.say){const nm=$("shTitle").textContent;say(nm,d.say);return}
  else if(d.send){say(d.send,$("chatIn").value);return}
  else if(d.c2c)itemC2C(+d.c2c);
  else if(d.b2c)itemB2C(+d.b2c);
  else if(d.q)searchSheet(d.q);
  else if(d.slot)adBuy(d.slot);
  else if(d.ad!==undefined&&!b.disabled){adStart=+d.ad;adUpd()}
  else if(d.adlen){adDays=+d.adlen;adUpd()}
  else if(d.kw){adKw=d.kw;document.querySelectorAll("#kwPick .kw").forEach(x=>x.setAttribute("aria-pressed",x.dataset.kw===adKw));adUpd()}
  else if(d.adbuy){
    const t=slotOf(d.adbuy),cost=adCost(),sup=d.adbuy.indexOf("b_")===0;
    if(!sup&&cost>gbal-locked){toast("G幣不足");return}
    for(let n=0;n<adDays&&adStart+n<DATES.length;n++)used[d.adbuy][adStart+n]=Math.min(t.seats,used[d.adbuy][adStart+n]+1);
    if(sup){
      const who=$("supPick")?$("supPick").value:"供應商";
      toast(`已為 ${who} 建立 ${t.n} ${adDays} 天排程`);close();tab="official";syncTabs();render();
    }else{
      gbal-=cost;
      if(myList[promoFor])myList[promoFor].ad=`${t.n} ${adDays} 天`;
      syncMine();
      toast(`已購買 ${t.n} ${adDays} 天`);close();tab="me";syncTabs();render();
    }
  }
  else if(d.prob){pro=true;toast("已升級官方認證商家");close();tab="me";syncTabs();render();}
  else if(d.go==="ads"){adCenter();return}
  else if(d.go==="chats"){chatList();return}
  else if(d.go==="notis"){notiSheet();return}
  else if(d.go==="sorders"){sellOrdersSheet();return}
  else if(d.go==="pro"){goPro();return}
  else if(d.ecpay){const sp=d.spec,q=+d.qty||1,tt=+d.tot||0;close();setTimeout(()=>buyB2C(+d.ecpay,sp,q,tt),260)}
  else if(d.pay){const cur=orders.find(x=>x.st===0&&x.pays&&x.pays.includes(d.pay));if(cur){cur.pay=d.pay;openOrder(cur.no)}}
  else if(d.paid){o.st=1;toast("已回報匯款");openOrder(o.no)}
  else if(d.ship){o.st=2;o.late=false;o.track="F"+String(Math.random()).slice(2,11);toast("已出貨");openOrder(o.no)}
  else if(d.late){o.late=true;toast("賣家逾時，可申訴");openOrder(o.no)}
  else if(d.claim){o.st=3;gbal+=o.p;toast(`已補償 ${nt(o.p)}G`);openOrder(o.no)}
  else if(d.recv){o.st=3;toast("交易完成");openOrder(o.no)}
  else if(d.pack){o.st=1;toast("備貨完成");openOrder(o.no)}
  else if(d.oship){o.st=2;o.track="F"+String(Math.random()).slice(2,11);toast("官方已出貨");openOrder(o.no)}
  else if(d.refund){o.st=3;toast("退款已送出");openOrder(o.no)}
  else if(d.p||d.p2){
    const v=d.p||d.p2,i=myPays.indexOf(v);
    if(i>-1){if(myPays.length===1){toast("至少保留一種收款方式");return}myPays.splice(i,1)}else myPays.push(v);
    document.querySelectorAll(`[${d.p?"data-p":"data-p2"}]`).forEach(x=>x.setAttribute("aria-pressed",myPays.includes(x.dataset.p||x.dataset.p2)));
  }
  else if(d.x){close();render()}
  else if(d.submit){
    const t=tierOf(ME),ti=$("sT").value.trim()||"未命名商品",p=+$("sP").value||0,q=+$("sQ").value||1;
    if(!p){toast("請輸入售價");return}
    if(p>t.max){toast(`「${t.n}」單件最高賣 ${nt(t.max)}`);return}
    const need=Math.ceil(p*t.ratio),sh=myShip;
    let sp=null,tq=q;
    const pack=r=>r.items.filter(m=>m.n.trim()).map(m=>({n:m.n.trim(),p:m.p||p,q:m.q,k:m.k||"fig"}));
    if(useSpec){
      const o=specTree.filter(r=>r.v.trim()).map(r=>({v:r.v.trim(),items:pack(r)})).filter(r=>r.items.length);
      if(!o.length){toast("請至少填一個規格與選項");return}
      sp={n:"規格",o};
      tq=o.reduce((n,x)=>n+x.items.reduce((a,m)=>a+m.q,0),0);
    }else{
      const items=pack(specTree[0]);
      if(items.length){sp={n:"品項",o:[{v:"",items}]};tq=items.reduce((a,m)=>a+m.q,0);}
    }
    myList.unshift({id:Date.now()%100000,t:ti,p,q:tq,need,ship:sh,k:"fig",st:"pending",locked:false,ad:"",views:0,specs:sp});
    toast("已送出審核，待平台核准後上架");close();tab="me";syncTabs();render();
  }
  if(orders.length&&tab==="orders")render();
});
document.querySelectorAll(".tabbar button").forEach(b=>b.onclick=()=>{tab=b.dataset.tab;syncTabs();render();if(tab==="orders")$("ordDot").style.display="none"});
function syncTabs(){document.querySelectorAll(".tabbar button").forEach(x=>x.setAttribute("aria-selected",x.dataset.tab===tab))}
syncMine();render();
})();
</script>
</body>
</html>
